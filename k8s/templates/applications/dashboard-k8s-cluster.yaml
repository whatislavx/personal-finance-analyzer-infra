apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-k8s-cluster
  namespace: finflow-monitoring
  labels:
    grafana_dashboard: "1"
spec:
  dashboard.json: |-
    {
      "gnetId": 3115,
      "title": "Kubernetes / Compute Resources / Cluster",
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "panels": [],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["kubernetes"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "version": 1
    }
