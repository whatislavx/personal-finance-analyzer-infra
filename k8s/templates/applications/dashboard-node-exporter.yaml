apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-node-exporter
  namespace: finflow-monitoring
  labels:
    grafana_dashboard: "1" 
spec:
  dashboard.json: |-
    {
      "gnetId": 1860,
      "title": "Node Exporter Full",
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [],
      "refresh": "1m",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["templated"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m", "5m", "15m", "30m", "1h", "2h", "1d"] },
      "timezone": "browser",
      "version": 1
    }
