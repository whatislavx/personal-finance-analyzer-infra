apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finflow-worker
  namespace: argocd
spec:
  project: finflow-apps
  source:
    repoURL: {{ .Values.global.repoUrl | quote }}
    targetRevision: {{ .Values.global.repoBranch | default "gitops/auto" | quote }}
    path: k8s/charts/app-component
    helm:
      valueFiles:
        - ../../values.yaml
      valuesObject:
        enabled: true
        imageName: "finflow-worker"
        imageTag: {{ .Values.worker.imageTag | quote }}
        registry: {{ .Values.worker.registry | quote }}
        replicaCount: 2
        containerPort: 8000
        hasService: false
        hasIngress: false
        serviceAccount:
          name: "finflow-worker-sa"
        csiSecrets:
          enabled: true
          secretProviderClass: "finflow-apps-secrets-provider"
          secretName: "finflow-worker-secret"
        config:
          DB_USER: "postgres"
          DB_HOST: "finflow-database-postgresql.finflow-infra.svc.cluster.local"
          DB_PORT: "5432"
          DB_NAME: "finance_analyzer_db"
          RABBITMQ_HOST: "finflow-rabbitmq.finflow-infra.svc.cluster.local"
          RABBITMQ_PORT: "5672"
          RABBITMQ_USER: "finflow_user"
          RABBITMQ_EXCHANGE: "jobs"
          S3_ENDPOINT: {{ .Values.global.s3Endpoint | quote }}
          S3_BUCKET: {{ .Values.global.s3Bucket | quote }}
          S3_REGION: {{ .Values.global.s3Region | quote }}
          GOTENBERG_URL: "http://gotenberg-gotenberg.finflow-infra.svc.cluster.local:3000"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: finflow-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true